[profile.default]
src = 'contracts'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib', 'node_modules']
solc_version = '0.8.30'
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ['@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/']
[fuzz]
runs = 256
